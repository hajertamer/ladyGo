
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/all.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
<link rel="icon" href="img/logo.png">
    <title>Login</title>
</head>

<body>

<div class="container min-vh-100 d-flex flex-column justify-content-center align-items-center ">

    <!-- Form -->
    <div class="w-100" style="max-width: 400px;">

        <form id="otpForm" class="p-4 shadow rounded bg-white" novalidate>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="email" type="email" name="Email" class="form-control" placeholder="Enter your email">
                <small id="emailError" class="text-danger error-message">Invalid email</small>
            </div>

            <div class="mb-3">
                <label class="form-label">OTP Code</label>
                <input id="otp" name="otp" type="text" class="form-control" placeholder="Enter Code">
                <small id="otpError" class="text-danger error-message"></small>
            </div>

            <div class="d-grid">
                <button type="submit" class="botn pt-2 pb-2">Confirm</button>
            </div>

        </form>


</div>

</div>

<!-- Bootstrap JS -->
<script src="js/bootstrap.bundle.js"></script>

<script src="js/auth.js"></script>

</body>
</html>
